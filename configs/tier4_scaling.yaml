# Tier 4: Scaling analysis + CKA similarity
# Token budgets: {5M, 20M, 50M} x 2 seeds = 6 runs
# Plus CKA across 3 models

source_training:
  model: EleutherAI/pythia-160m
  max_tokens: 50000000
  seq_len: 512
  batch_size: 16
  lr: 3.0e-5
  warmup_steps: 1000
  seed: 42
  table_size: 65536
  d_head: 64
  max_ngram: 3
  heads_per_order: 4

adaptor_training:
  target_model: EleutherAI/pythia-410m
  seq_len: 512
  batch_size: 16
  lr: 3.0e-5
  warmup_steps: 500

scaling:
  token_budgets: [5000000, 20000000, 50000000]
  conditions: [transferred, train_from_scratch]
  seeds: [42, 137]

cka:
  models:
    - EleutherAI/pythia-160m
    - EleutherAI/pythia-410m
    - TinyLlama/TinyLlama-1.1B-Chat-v1.0
  n_samples: 10000
