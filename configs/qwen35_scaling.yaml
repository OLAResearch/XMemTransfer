# Qwen3.5 Scaling Analysis
# Source: Qwen3.5-0.8B -> Targets: {2B, 4B, 9B}
# Tests transfer across increasing scale gaps

source_training:
  model: Qwen/Qwen3.5-0.8B-Base
  max_tokens: 50000000
  seq_len: 512
  batch_size: 16
  lr: 3.0e-5
  memory_lr: 1.0e-3
  warmup_steps: 1000
  seed: 42
  table_size: 65536
  d_head: 64
  max_ngram: 3
  heads_per_order: 4

scaling:
  targets:
    - model: Qwen/Qwen3.5-2B-Base
      d_model: 2048
    - model: Qwen/Qwen3.5-4B-Base
      d_model: 2560
    - model: Qwen/Qwen3.5-9B-Base
      d_model: 4096
  conditions: [transferred, random_memory]
  seeds: [42, 137]
  max_tokens: 20000000
  lr: 3.0e-5
  warmup_steps: 500
