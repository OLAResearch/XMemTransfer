# Tier 2: Cross-tokenizer transfer
# Pythia-160M (GPT-NeoX BPE) -> TinyLlama-1.1B (Llama SentencePiece)
# Uses word-boundary canonicalization
# 3 conditions x 3 seeds = 9 runs

source_training:
  model: EleutherAI/pythia-160m
  max_tokens: 50000000  # 50M
  seq_len: 512
  batch_size: 16
  lr: 3.0e-5
  warmup_steps: 1000
  seed: 42
  table_size: 65536
  d_head: 64
  max_ngram: 3
  heads_per_order: 4

adaptor_training:
  target_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  max_tokens: 20000000  # 20M
  seq_len: 512
  batch_size: 16
  lr: 3.0e-5
  warmup_steps: 500
  canon_mode: word_boundary

conditions:
  - baseline
  - transferred
  - random_memory

seeds: [42, 137, 2024]
