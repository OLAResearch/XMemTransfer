# Tier 3: Full ablation study on Pythia-160M -> Pythia-410M
# 8 conditions x 3 seeds = 24 runs

source_training:
  model: EleutherAI/pythia-160m
  max_tokens: 50000000  # 50M
  seq_len: 512
  batch_size: 16
  lr: 3.0e-5
  warmup_steps: 1000
  seed: 42
  table_size: 65536
  d_head: 64
  max_ngram: 3
  heads_per_order: 4

adaptor_training:
  target_model: EleutherAI/pythia-410m
  max_tokens: 20000000  # 20M
  seq_len: 512
  batch_size: 16
  lr: 3.0e-5
  warmup_steps: 500

conditions:
  - baseline            # 0: No memory
  - transferred         # 1: Full method (main claim)
  - random_memory       # 2: Random frozen memory
  - permuted_keys       # 3: Row-permuted keys
  - no_gate             # 4: W_V only, alpha=1
  - train_from_scratch  # 5: Fresh trainable memory
  - ffn_only            # 6: MLP residual, no memory
  - affine_stitch       # 7: Affine map (Chen et al.)

seeds: [42, 137, 2024]
