# Pilot run: validate correctness before full experiments
# 1 seed, 2M tokens, 4 conditions on Pythia-160M -> Pythia-410M

source_training:
  model: EleutherAI/pythia-160m
  max_tokens: 2000000  # 2M (pilot)
  seq_len: 512
  batch_size: 8
  lr: 3.0e-5
  warmup_steps: 100
  seed: 42
  table_size: 65536
  d_head: 64
  max_ngram: 3
  heads_per_order: 4
  log_every: 20
  eval_every: 100

adaptor_training:
  target_model: EleutherAI/pythia-410m
  max_tokens: 2000000  # 2M (pilot)
  seq_len: 512
  batch_size: 8
  lr: 3.0e-5
  warmup_steps: 100
  log_every: 20
  eval_every: 100

conditions:
  - baseline
  - transferred
  - random_memory
  - train_from_scratch

seeds: [42]
