# Qwen3.5 Same-Tokenizer Transfer
# Source: Qwen3.5-0.8B (d=1024) -> Target: Qwen3.5-4B (d=2560)
# All Qwen3.5 models share the same tokenizer (vocab=248320)
# 3 conditions x 3 seeds = 9 runs

source_training:
  model: Qwen/Qwen3.5-0.8B-Base
  max_tokens: 50000000
  seq_len: 512
  batch_size: 16
  lr: 3.0e-5
  memory_lr: 1.0e-3
  warmup_steps: 1000
  seed: 42
  table_size: 65536
  d_head: 64
  max_ngram: 3
  heads_per_order: 4

adaptor_training:
  target_model: Qwen/Qwen3.5-4B-Base
  max_tokens: 20000000
  seq_len: 512
  batch_size: 16
  lr: 3.0e-5
  warmup_steps: 500

conditions:
  - baseline
  - transferred
  - random_memory

seeds: [42, 137, 2024]
